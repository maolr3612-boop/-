<!doctype html><meta charset="utf-8"><iframe id="site" src="/#works" width="390" height="844"></iframe><pre id="result">WAITING</pre><script>
const checks=[];function check(v,name){if(!v)throw Error(name);checks.push(name)}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}async function until(f){for(let i=0;i<50;i++){if(f())return;await sleep(100)}throw Error('Timed out')}
site.onload=async()=>{try{const w=site.contentWindow,d=w.document,$=s=>d.querySelector(s);await until(()=>!$('#add-work').hidden);check(!$('#work-empty').hidden,'empty state');check(d.documentElement.scrollWidth<=390,'mobile no overflow');$('#add-work').click();check($('#work-editor').open,'create dialog opens');const f=$('#work-form');f.elements.title.value='浏览器测试作品';f.elements.description.value='来自本地测试的作品介绍';f.elements.tags.value='AI,本地测试';const dt=new w.DataTransfer();dt.items.add(new w.File([Uint8Array.from(atob('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+jX1cAAAAASUVORK5CYII='),x=>x.charCodeAt(0))],'test.png',{type:'image/png'}));f.elements.cover.files=dt.files;f.elements.cover.dispatchEvent(new w.Event('change',{bubbles:true}));check(!$('#cover-preview-wrap').hidden,'cover preview');f.requestSubmit();await until(()=>!$('#work-editor').open);check(d.querySelectorAll('.work-card').length===1,'save renders card');$('.work-card-open').click();check($('#work-detail').open&&$('#detail-title').textContent==='浏览器测试作品','detail opens');$('#close-detail').click();$('#manage-works').click();$('.work-card-tools button').click();f.elements.title.value='更新后的测试作品';f.requestSubmit();await until(()=>!$('#work-editor').open);check($('.work-card-title').textContent.includes('更新后'),'edit saved');$('#work-search').value='不存在';$('#work-search').dispatchEvent(new w.Event('input'));check(d.querySelectorAll('.work-card').length===0,'search filters');$('#work-search').value='';$('#work-search').dispatchEvent(new w.Event('input'));$('.work-card-tools button:last-child').click();check($('#delete-dialog').open,'delete confirmation');$('#cancel-delete').click();check(d.querySelectorAll('.work-card').length===1,'cancel preserves card');$('.work-card-tools button:last-child').click();$('#confirm-delete').click();await until(()=>!$('#delete-dialog').open);check(d.querySelectorAll('.work-card').length===0,'delete removes card');result.textContent=JSON.stringify({pass:true,checks})}catch(e){result.textContent=JSON.stringify({pass:false,error:e.message,checks})}};
</script>
