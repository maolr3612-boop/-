<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#090c0d}iframe{width:100%;height:1100px;border:0}pre{color:#fff}</style><iframe id="site" src="/"></iframe><pre id="result">WAITING</pre><script>
site.onload=async()=>{let checks=[];try{const w=site.contentWindow,d=w.document,c=d.querySelector('#turntable');for(let i=0;i<200&&c.dataset.ready!=='true';i++)await new Promise(r=>setTimeout(r,100));function check(x,n){if(!x)throw Error(n);checks.push(n)}check(c.dataset.ready==='true','GLB loaded');check(+c.dataset.triangles>10000,'real mesh triangles');function key(k){c.dispatchEvent(new w.KeyboardEvent('keydown',{key:k,bubbles:true}))}const a=+c.dataset.angle;key('ArrowRight');await new Promise(r=>setTimeout(r,100));check(Math.abs(+c.dataset.angle-a)>1,'continuous 3-degree azimuth');check(Math.abs(+c.dataset.angle%45)>1,'not 8-frame stepping');const e=+c.dataset.elevation;key('ArrowUp');await new Promise(r=>setTimeout(r,100));check(Math.abs(+c.dataset.elevation-e)>1,'vertical orbit');const dist=+c.dataset.distance;key('+');await new Promise(r=>setTimeout(r,100));check(+c.dataset.distance<dist,'zoom');d.querySelector('#reset-model').click();await new Promise(r=>setTimeout(r,150));const view=Number(new URLSearchParams(location.search).get('view')||0);for(let i=0;i<Math.round(view/3);i++)key('ArrowRight');await new Promise(r=>setTimeout(r,300));result.textContent=JSON.stringify({pass:true,checks,triangles:c.dataset.triangles,angle:c.dataset.angle});}catch(e){result.textContent=JSON.stringify({pass:false,error:e.message,checks})}};
</script>
