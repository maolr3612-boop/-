/* ---------- 查询函数 ---------- */

function getCountries() {
  return countries
}

function getHotCountries() {
  return countries.filter(function (c) { return c.hot })
}

function getCountryById(id) {
  for (var i = 0; i < countries.length; i++) {
    if (countries[i].id === id) return countries[i]
  }
  return null
}

function getBanners() {
  return banners
}

function getBannerById(id) {
  for (var i = 0; i < banners.length; i++) {
    if (banners[i].id === id) return banners[i]
  }
  return null
}

function getCategories() {
  return categories
}

function getJobs() {
  return jobs
}

function getJobById(id) {
  for (var i = 0; i < jobs.length; i++) {
    if (jobs[i].id === id) return jobs[i]
  }
  return null
}

function getJobCountByCountry(countryId) {
  var count = 0
  for (var i = 0; i < jobs.length; i++) {
    if (jobs[i].countryId === countryId) count++
  }
  return count
}

function getHotJobs(limit) {
  var hot = jobs.filter(function (j) { return j.hot })
  var rest = jobs.filter(function (j) { return !j.hot })
  var list = hot.concat(rest)
  return typeof limit === 'number' ? list.slice(0, limit) : list
}

// 综合筛选：关键词 / 国家 / 工种 / 排序
// 搜索同义词：用户常用的口语词 → 岗位数据里的正式用词（如「护士」应能搜到「护理养老」岗位）
var JOB_SYNONYMS = {
  '护士': ['护理', '介护', '看护'],
  '护工': ['护理', '介护', '看护'],
  '保姆': ['月嫂', '家政', '护理'],
  '阿姨': ['月嫂', '家政'],
  '司机': ['驾驶', '司机'],
  '厨师': ['厨师', '炒锅', '面点', '餐饮'],
  '服务员': ['服务'],
  '建筑': ['建筑', '木工', '钢筋', '瓦工', '砌筑'],
  '焊工': ['焊工', '电焊', '焊接'],
  '电焊': ['焊工', '电焊', '焊接'],
  '幼师': ['幼教', '保育'],
  '工厂': ['制造', '生产', '组装'],
  '普工': ['制造', '组装', '包装', '操作'],
  '农业': ['农业', '种植', '养殖', '采摘']
}

function queryJobs(options) {
  options = options || {}
  var keyword = (options.keyword || '').trim()
  var terms = [keyword]
  if (keyword && JOB_SYNONYMS[keyword]) terms = terms.concat(JOB_SYNONYMS[keyword])
  var list = jobs.filter(function (job) {
    if (options.countryId && options.countryId !== 'all' && job.countryId !== options.countryId) return false
    if (options.category && options.category !== 'all' && job.category !== options.category) return false
    if (keyword) {
      var hay = job.title + job.countryName + job.category + job.city + job.company + job.tags.join('')
      var hit = false
      for (var ti = 0; ti < terms.length; ti++) {
        if (hay.indexOf(terms[ti]) !== -1) { hit = true; break }
      }
      if (!hit) return false
    }
    return true
  })
  if (options.sort === 'hot') {
    list = list.slice().sort(function (a, b) {
      if (a.hot === b.hot) return b.views - a.views
      return a.hot ? -1 : 1
    })
  } else {
    // 默认按发布时间倒序
    list = list.slice().sort(function (a, b) {
      return a.createdAt < b.createdAt ? 1 : -1
    })
  }
  return list
}

// 相关岗位：同国家或同工种，排除自身
function getRelatedJobs(job, limit) {
  var sameCountry = jobs.filter(function (j) {
    return j.id !== job.id && j.countryId === job.countryId
  })
  var sameCategory = jobs.filter(function (j) {
    return j.id !== job.id && j.countryId !== job.countryId && j.category === job.category
  })
  var list = sameCountry.concat(sameCategory)
  return list.slice(0, limit || 3)
}

function getNews(category, limit) {
  var list = category && category !== '全部'
    ? news.filter(function (n) { return n.category === category })
    : news.slice()
  list = list.slice().sort(function (a, b) {
    return a.date < b.date ? 1 : -1
  })
  return typeof limit === 'number' ? list.slice(0, limit) : list
}

  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    })
  }

  function pad2(n) {
    return n < 10 ? '0' + n : '' + n
  }

  function formatDate(ts) {
    var d = new Date(ts)
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate())
  }

  var toastTimer = null
  function showToast(msg) {
    var el = document.getElementById('toast')
    if (!el) return
    el.textContent = msg
    el.classList.add('show')
    if (toastTimer) clearTimeout(toastTimer)
    toastTimer = setTimeout(function () {
      el.classList.remove('show')
    }, 1800)
  }

  function copyText(text) {
    var done = function () { showToast('顾问微信已复制：' + text) }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done) })
    } else {
      fallbackCopy(text, done)
    }
  }

  function fallbackCopy(text, done) {
    var ta = document.createElement('textarea')
    ta.value = text
    ta.style.position = 'fixed'
    ta.style.opacity = '0'
    document.body.appendChild(ta)
    ta.select()
    try { document.execCommand('copy') } catch (e) {}
    document.body.removeChild(ta)
    done()
  }

  /* ============ 本地存储（与小程序版同 key） ============ */

  var KEYS = {
    USER: 'ol_user_v1',
    FAVORITES: 'ol_favorites_v1',
    APPLICATIONS: 'ol_applications_v1'
  }

  function lsGet(key, fallback) {
    try {
      var v = localStorage.getItem(key)
      return v ? JSON.parse(v) : fallback
    } catch (e) {
      return fallback
    }
  }

  function lsSet(key, val) {
    try {
      localStorage.setItem(key, JSON.stringify(val))
      return true
    } catch (e) {
      return false
    }
  }

  var store = {
    getUser: function () { return lsGet(KEYS.USER, null) },
    setUser: function (user) { return lsSet(KEYS.USER, user) },
    clearUser: function () { try { localStorage.removeItem(KEYS.USER) } catch (e) {} },
    isLoggedIn: function () { return !!this.getUser() },
    getFavorites: function () { return lsGet(KEYS.FAVORITES, []) },
    isFavorite: function (jobId) { return this.getFavorites().indexOf(jobId) !== -1 },
    toggleFavorite: function (jobId) {
      var favs = this.getFavorites()
      var idx = favs.indexOf(jobId)
      if (idx === -1) {
        favs.unshift(jobId)
        lsSet(KEYS.FAVORITES, favs)
        return true
      }
      favs.splice(idx, 1)
      lsSet(KEYS.FAVORITES, favs)
      return false
    },
    removeFavorite: function (jobId) {
      var favs = this.getFavorites()
      var idx = favs.indexOf(jobId)
      if (idx !== -1) {
        favs.splice(idx, 1)
        lsSet(KEYS.FAVORITES, favs)
      }
    },
    getApplications: function () { return lsGet(KEYS.APPLICATIONS, []) },
    addApplication: function (app) {
      var list = this.getApplications()
      var record = {
        id: 'A' + Date.now(),
        status: '待跟进',
        createdAt: Date.now()
      }
      Object.keys(app).forEach(function (k) { record[k] = app[k] })
      list.unshift(record)
      lsSet(KEYS.APPLICATIONS, list)
      return record
    },

  /* ============ 路由 ============ */

  var TAB_PAGES = ['home', 'jobs', 'news', 'profile']

  function parseHash(hash) {
    if (typeof hash !== 'string') hash = ''
    var raw = hash.replace(/^#/, '')
    if (!raw) raw = '/home'
    var qIndex = raw.indexOf('?')
    var pathPart = qIndex === -1 ? raw : raw.slice(0, qIndex)
    var query = {}
    if (qIndex !== -1) {
      raw.slice(qIndex + 1).split('&').forEach(function (pair) {
        if (!pair) return
        var kv = pair.split('=')
        var k = decodeURIComponent(kv[0] || '')
        if (k) query[k] = decodeURIComponent(kv[1] || '')
      })
    }
    var parts = pathPart.split('/').filter(function (p) { return !!p })
    return { path: parts, query: query, raw: raw }
  }

  function go(hash) {
    if (typeof location === 'undefined') return
    if ((location.hash || '') === hash) {
      render()
    } else {
      location.hash = hash
    }
  }

  function isTabRoute(route) {
    return TAB_PAGES.indexOf(route) !== -1
  }

  function startBanner() {
    var box = document.querySelector('.banner')
    if (!box) return
    var slides = box.querySelectorAll('.banner-slide')
    var dots = box.querySelectorAll('.banner-dot')
    if (slides.length < 2) return
    var i = 0
    var timer = setInterval(function () {
      i = (i + 1) % slides.length
      slides.forEach(function (s, idx) { s.classList.toggle('active', idx === i) })
      dots.forEach(function (d, idx) { d.classList.toggle('active', idx === i) })
    }, 4000)
    timers.push(timer)
  }

        '<div class="tips">' +
          '<div class="tips-title">报名进度说明</div>' +
          '<div class="tips-text">提交报名后，顾问将在 1 个工作日内电话联系您确认意向；面试安排、签证进度可在「我的报名」中随时查看，状态更新以顾问通知为准。</div>' +
        '</div>' +
      '</div>'
  }

  /* ---------- 公司资质 ---------- */

  function CompanyPage() {
    var stats = COMPANY.stats.map(function (s) {
      return '' +
        '<div class="stat-item">' +
          '<span class="stat-num">' + esc(s.num) + '</span>' +
          '<span class="stat-unit tag-orange" style="font-size:10px;margin:2px 0 0">' + esc(s.unit) + '</span>' +
          '<span class="stat-label">' + esc(s.label) + '</span>' +
        '</div>'
    }).join('')

    var certs = COMPANY.certs.map(function (c) {
      return '' +
        '<div class="cert-item">' +
          '<span class="cert-seal">证</span>' +
          '<div class="flex-1">' +
            '<div class="cert-name">' + esc(c.name) + '</div>' +
            '<div class="muted">编号：' + esc(c.no) + '</div>' +
          '</div>' +
        '</div>'
    }).join('')

    var services = COMPANY.services.map(function (s) {
      return '' +
        '<div class="card service-item">' +
          '<div class="service-title">' + esc(s.title) + '</div>' +
          '<div class="service-desc">' + esc(s.desc) + '</div>' +
        '</div>'
    }).join('')

    var promises = COMPANY.promises.map(function (p) {
      return '<div class="promise-item"><span class="promise-check"></span><span class="flex-1">' + esc(p) + '</span></div>'
    }).join('')

    var infoRows = [
      ['统一社会信用代码', COMPANY.creditCode],
      ['法定代表人', COMPANY.legalRep],
      ['注册资本', COMPANY.capital],
      ['公司类型', COMPANY.companyType],
      ['成立日期', COMPANY.regDate],
      ['注册地址', COMPANY.address]
    ].filter(function (r) { return r[1] }).map(function (r) {
      return '<div class="contact-row"><span class="contact-label">' + esc(r[0]) + '</span><span class="flex-1">' + esc(r[1]) + '</span></div>'
    }).join('')

    var phoneDigits = (COMPANY.phone || '').replace(/[^0-9+]/g, '')
    var hasWechat = /[0-9A-Za-z]/.test(COMPANY.wechat || '')
    var phoneRow = '<div class="contact-row">' +
      '<span class="contact-label">咨询电话</span>' +
      '<span class="flex-1">' + esc(COMPANY.phone || '待补充') + '</span>' +
      (phoneDigits ? '<a class="btn btn-plain" href="tel:' + phoneDigits + '">拨打</a>' : '<span class="muted">待补充</span>') +
      '</div>'
    var wechatRow = '<div class="contact-row">' +
      '<span class="contact-label">顾问微信</span>' +
      '<span class="flex-1">' + esc(COMPANY.wechat || '待补充') + '</span>' +
      (hasWechat ? '<button class="btn btn-plain" data-action="copy-wechat">复制</button>' : '<span class="muted">待补充</span>') +
      '</div>'

    return '' +
      '<div class="page-pad">' +
        '<div class="company-hero">' +
          '<div class="company-name">' + esc(COMPANY.name) + '</div>' +
          '<div class="company-slogan">' + esc(COMPANY.slogan) + '</div>' +
        '</div>' +
        '<div class="card stats-card">' + stats + '</div>' +
        '<div class="section-header"><span class="section-title">公司简介</span></div>' +
        '<div class="card"><div class="card-text">' + esc(COMPANY.intro) + '</div></div>' +
        '<div class="section-header"><span class="section-title">工商登记信息</span></div>' +
        '<div class="card">' + infoRows + '</div>' +
        '<div class="section-header"><span class="section-title">资质证书</span></div>' +
        '<div class="card">' + certs + '</div>' +
        '<div class="section-header"><span class="section-title">服务内容</span></div>' +
        '<div class="service-grid">' + services + '</div>' +
        '<div class="section-header"><span class="section-title">服务承诺</span></div>' +
        '<div class="card">' + promises + '</div>' +
        '<div class="section-header"><span class="section-title">联系我们</span></div>' +
        '<div class="card">' +
          phoneRow +
          wechatRow +
          '<div class="contact-row">' +
            '<span class="contact-label">公司地址</span>' +
            '<span class="flex-1">' + esc(COMPANY.address) + '</span>' +
          '</div>' +
          '<div class="contact-row">' +
            '<span class="contact-label">服务时间</span>' +
            '<span class="flex-1">' + esc(COMPANY.hours || '服务时间待补充') + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="version muted text-center">成立于 ' + esc(COMPANY.founded) + ' 年 · v1.0.0</div>' +
      '</div>'
  }

  /* ---------- 出国流程 ---------- */

  function ProcessPage() {
    var steps = getProcessSteps().map(function (s, i) {
      return '' +
        '<div class="timeline-item">' +
          '<div class="timeline-left">' +
            '<div class="timeline-dot' + (i === 0 ? ' timeline-dot-active' : '') + '">' + s.step + '</div>' +
            (i < getProcessSteps().length - 1 ? '<div class="timeline-line"></div>' : '') +
          '</div>' +
          '<div class="card timeline-card">' +
            '<div class="row-between">' +
              '<span class="title-md flex-1">' + esc(s.title) + '</span>' +
              '<span class="duration-badge">' + esc(s.duration) + '</span>' +
            '</div>' +
            '<div class="card-text" style="margin-top:6px">' + esc(s.desc) + '</div>' +
            '<div class="docs">' +
              '<span class="docs-label">所需：</span>' +
              s.docs.map(function (d) { return '<span class="tag tag-blue">' + esc(d) + '</span>' }).join('') +
            '</div>' +
          '</div>' +
        '</div>'
    }).join('')

    return '' +
      '<div class="page-pad">' +
        '<div class="muted" style="padding:4px 2px 18px;line-height:1.8">从报名到出境落地，全程专业团队跟进。以下为标准流程，各阶段所需时间因国家与岗位而异，顾问会根据您的实际情况制定专属时间表。</div>' +
        '<div class="timeline">' + steps + '</div>' +
        '<div class="card">' +
          '<div class="title-md">准备好迈出第一步了吗？</div>' +
          '<div class="muted" style="margin:8px 0 16px">提交报名后，顾问将为您免费评估匹配岗位</div>' +
          '<a class="btn btn-primary btn-block" href="tel:' + COMPANY.phone.replace(/[^0-9+]/g, '') + '">电话咨询</a>' +
        '</div>' +
      '</div>'
  }

  /* ---------- 常见问题 ---------- */

  function FaqPage() {
    var faqs = getFaqs().map(function (f, i) {
      var open = ui.faqOpen === i
      return '' +
        '<div class="card faq-item">' +
          '<div class="row-between" data-action="faq-toggle" data-value="' + i + '">' +
            '<div class="flex-1 row">' +
              '<span class="faq-q-index">Q' + (i + 1) + '</span>' +
              '<span class="faq-q">' + esc(f.q) + '</span>' +
            '</div>' +
            '<span class="faq-arrow' + (open ? ' faq-arrow-open' : '') + '"></span>' +
          '</div>' +
          (open ? '<div class="faq-a">' + esc(f.a) + '</div>' : '') +
        '</div>'
    }).join('')

    return '' +
      '<div class="page-pad">' +
        '<div class="card notice-card">' +
          '<div class="notice-title">收费透明承诺</div>' +
          '<div class="notice-text">报名前顾问会出具书面《收费明细表》，逐项列明费用名称、金额与退还条件；所有费用进入公司对公账户并开具发票。面试未通过、签证未获批，按合同约定退费。</div>' +
        '</div>' +
        '<div>' + faqs + '</div>' +
        '<div class="card">' +
          '<div class="title-md">还有其他疑问？</div>' +
          '<div class="muted" style="margin:8px 0 16px">顾问一对一免费解答，为您提供留学、职业与生活服务咨询</div>' +
          '<div class="row">' +
            ((COMPANY.phone || '').replace(/[^0-9+]/g, '') ? '<a class="btn btn-plain flex-1" style="margin-right:12px" href="tel:' + (COMPANY.phone || '').replace(/[^0-9+]/g, '') + '">电话咨询</a>' : '<span class="btn btn-plain flex-1" style="margin-right:12px;opacity:.55">电话待补充</span>') +
            (/[0-9A-Za-z]/.test(COMPANY.wechat || '') ? '<button class="btn btn-primary flex-1" data-action="copy-wechat">微信咨询</button>' : '<span class="btn btn-plain flex-1" style="opacity:.55">微信待补充</span>') +
          '</div>' +
        '</div>' +
      '</div>'
  }

  /* ============ 路由渲染 ============ */

  var TAB_META = {
    home: { title: '恒翔商务服务' },
    jobs: { title: '热招岗位' },
    news: { title: '劳务资讯' },
    profile: { title: '我的' }
  }

  function render() {
    clearTimers()
    var r = parseHash(location.hash)
    var route = r.path[0] || 'home'
    var sub = r.path[1] || ''
    var html = ''
    var title = '恒翔商务服务'

    switch (route) {
      case 'home':
        html = HomePage()
        title = TAB_META.home.title
        break
      case 'jobs':
        if (r.query.country) ui.jobsCountry = r.query.country
        if (typeof r.query.keyword === 'string') ui.jobsKeyword = r.query.keyword
        html = JobsPage()
        title = TAB_META.jobs.title
        // 查询参数已应用到 ui，清理 hash，避免用户后续点选筛选时被旧参数覆盖
        if (r.raw !== '/jobs' && history.replaceState) {
          history.replaceState(null, '', location.pathname + location.search + '#/jobs')
        }
        break
      case 'job':
        html = JobDetailPage(sub)
        var job = getJobById(sub)
        title = job ? job.title : '岗位详情'
        break
      case 'news':
        if (sub) {
          html = NewsDetailPage(sub)
          var newsItem = getNewsById(sub)
          title = newsItem ? newsItem.category : '资讯详情'
        } else {
          html = NewsPage()
          title = TAB_META.news.title
        }
        break
      case 'profile':
        html = ProfilePage()
        title = TAB_META.profile.title
        break
      case 'login':
        html = LoginPage(r.query)
        title = '登录'
        break
      case 'apply':
        html = ApplyPage(sub)
        title = '岗位报名'
        break
      case 'favorites':
        html = FavoritesPage()
        title = '我的收藏'
        break
      case 'applications':
        html = ApplicationsPage()
        title = '我的报名'
        break
      case 'company':
        html = CompanyPage()
        title = '公司资质'
        break
      case 'process':
        html = ProcessPage()
        title = '出国流程'
        break
      case 'faq':
        html = FaqPage()
        title = '费用说明'
        break
      case 'agreement':
        html = LegalPage('agreement')
        title = '用户服务协议'
        break
      case 'privacy':
        html = LegalPage('privacy')
        title = '隐私政策'
        break
      default:
        location.hash = '#/home'
        return
    }

    pageEl.innerHTML = html
    document.title = title + ' - ' + (COMPANY.shortName || '恒翔商务服务')

    // 顶部导航
    var showTab = isTabRoute(route)
    var backBtn = showTab
      ? '<span class="topbar-placeholder"></span>'
      : '<button class="topbar-btn back-btn" data-action="back" aria-label="返回"></button>'
    var shareBtn = route === 'job' && sub
      ? '<button class="topbar-btn" data-action="share" aria-label="分享"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button>'
      : '<span class="topbar-placeholder"></span>'
    topbarEl.innerHTML = backBtn + '<span class="topbar-title' + (showTab ? '' : ' has-side') + '">' + esc(title) + '</span>' + shareBtn
    topbarEl.style.display = 'flex'

    // tab 栏
    if (showTab) {
      tabbarEl.style.display = 'flex'
      var items = tabbarEl.querySelectorAll('.tabbar-item')
      items.forEach(function (item) {
        item.classList.toggle('active', item.getAttribute('data-route') === route)
      })
    } else {
      tabbarEl.style.display = 'none'
    }

    // 页面专属行为
    if (route === 'home') startBanner()
    if (route === 'jobs' && r.query.focus) {
      var input = document.getElementById('job-search')
      if (input) input.focus()
    }
    window.scrollTo(0, 0)
  }

  /* ============ 事件处理 ============ */

  function setByPath(obj, path, value) {
    var parts = path.split('.')
    var cur = obj
    for (var i = 0; i < parts.length - 1; i++) {
      cur = cur[parts[i]]
      if (!cur) return
    }
    cur[parts[parts.length - 1]] = value
  }

  function onInput(e) {
    var t = e.target
    if (!t || !t.getAttribute) return
    var model = t.getAttribute('data-model')
    if (!model) return
    setByPath(ui, model, t.value)
    if (model === 'jobsKeyword') {
      var listBox = document.getElementById('job-list')
      if (listBox) listBox.innerHTML = jobListHtml()
      var total = document.querySelector('.sort-total')
      if (total) total.textContent = '共 ' + filteredJobs().length + ' 个岗位'
      var clearBtn = document.querySelector('.search-clear')
      if (!clearBtn && ui.jobsKeyword) {
        var box = document.querySelector('.search-box')
        if (box) {
          var btn = document.createElement('button')
          btn.className = 'search-clear'
          btn.setAttribute('data-action', 'clear-keyword')
          btn.textContent = '×'
          box.appendChild(btn)
        }
      } else if (clearBtn && !ui.jobsKeyword) {
        clearBtn.remove()
      }
    }
  }

  function doLogin() {
    var nickname = (ui.loginForm.nickname || '').trim()
    var phone = (ui.loginForm.phone || '').trim()
    if (nickname.length < 2 || nickname.length > 20) {
      showToast('请输入 2-20 个字的昵称')
      return
    }
    if (!/^1\d{10}$/.test(phone)) {
      showToast('请输入正确的 11 位手机号')
      return
    }
    store.setUser({ nickname: nickname, phone: phone })
    showToast('登录成功')
    var redirect = ui.loginRedirect
    ui.loginRedirect = ''
    ui.loginForm = { nickname: '', phone: '' }
    if (redirect) {
      go(redirect.charAt(0) === '#' ? redirect : '#' + redirect)
    } else {
      go('#/profile')
    }
  }

  function doApply(jobId) {
    var job = getJobById(jobId)
    if (!job) return
    if (!store.isLoggedIn()) {
      requireLogin('#/apply/' + job.id)
      return
    }
    var f = ui.applyForm
    if (!f.name || f.name.trim().length < 2) {
      showToast('请输入真实姓名（至少 2 个字）')
      return
    }
    if (!/^1\d{10}$/.test(f.phone)) {
      showToast('请输入正确的 11 位手机号')
      return
    }
    if (!f.gender) {
      showToast('请选择性别')
      return
    }
    if (!f.age) {
      showToast('请输入年龄')
      return
    }
    store.addApplication({
      jobId: job.id,
      jobTitle: job.title,
      countryName: job.countryName,
      city: job.city,
      salaryText: job.salaryText,
      name: f.name.trim(),
      phone: f.phone,
      wechat: f.wechat,
      gender: f.gender,
      age: f.age,
      note: f.note
    })
    ui.applyForm = { name: '', phone: '', wechat: '', gender: '', age: '', note: '' }
    showToast('报名成功')
    setTimeout(function () {
      go('#/applications')
    }, 600)
  }

  function shareCurrent() {
    var url = location.href
    var title = currentJob ? currentJob.title + ' · ' + currentJob.salaryText : (COMPANY.shortName || '恒翔商务服务')
    if (navigator.share) {
      navigator.share({ title: title, text: title, url: url }).catch(function () {})
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () {
        showToast('链接已复制，粘贴分享给好友')
      }, function () { showToast('请复制地址栏链接进行分享') })
    } else {
      showToast('请复制地址栏链接进行分享')
    }
  }

  function onClick(e) {
    var actEl = e.target.closest ? e.target.closest('[data-action]') : null
    if (!actEl) return
    var action = actEl.getAttribute('data-action')
    var id = actEl.getAttribute('data-id')
    var value = actEl.getAttribute('data-value')

    switch (action) {
      case 'back':
        if (history.length > 1) {
          history.back()
        } else {
          go('#/home')
        }
        break
      case 'share':
        shareCurrent()
        break
      case 'copy-wechat':
        if (!/[0-9A-Za-z]/.test(COMPANY.wechat || '')) { showToast('微信号待补充，请稍后再试'); break }
        copyText(COMPANY.wechat)
        break
      case 'toggle-fav':
        if (!requireLogin('#/job/' + id)) return
        {
          var faved = store.toggleFavorite(id)
          showToast(faved ? '已加入收藏' : '已取消收藏')
          render()
        }
        break
      case 'go-apply':
        if (!requireLogin('#/apply/' + id)) return
        go('#/apply/' + id)
        break
      case 'set-gender':
        ui.applyForm.gender = value
        render()
        break
      case 'submit-login':
        doLogin()
        break
      case 'submit-apply':
        doApply(id)
        break
      case 'logout':
        if (window.confirm('退出后本地收藏与报名记录仍会保留，重新登录后可查看，确定退出吗？')) {
          store.clearUser()
          showToast('已退出登录')
          render()
        }
        break
      case 'remove-fav':
        if (window.confirm('确定取消收藏该岗位吗？')) {
          store.removeFavorite(id)
          showToast('已取消收藏')
          render()
        }
        break
      case 'cancel-apply':
        if (window.confirm('确定取消该岗位的报名记录吗？取消后可重新报名。')) {
          store.removeApplication(id)
          showToast('已取消报名')
          render()
        }
        break
      case 'filter-country':
        ui.jobsCountry = value
        render()
        break
      case 'filter-category':
        ui.jobsCategory = value
        render()
        break
      case 'filter-news':
        ui.newsCategory = value
        renderNewsList()
        break
      case 'sort':
        ui.jobsSort = value
        render()
        break
      case 'clear-keyword':
        ui.jobsKeyword = ''
        render()
        break
      case 'reset-filter':
        ui.jobsKeyword = ''
        ui.jobsCountry = 'all'
        ui.jobsCategory = 'all'
        ui.jobsSort = 'new'
        render()
        break
      case 'faq-toggle':
        ui.faqOpen = ui.faqOpen === Number(value) ? -1 : Number(value)
        render()
        break
      default:
        break
    }
  }

  function renderNewsList() {
    var cats = getNewsCategories()
    var chipsBox = document.querySelector('.filter-bar .filter-scroll')
    if (chipsBox) {
      chipsBox.innerHTML = cats.map(function (c) {
        return '<button class="chip' + ((ui.newsCategory || '全部') === c ? ' chip-active' : '') + '" data-action="filter-news" data-value="' + esc(c) + '">' + esc(c) + '</button>'
      }).join('')
    }
    var list = getNews(ui.newsCategory || '全部')
    var box = document.querySelector('.news-list')
    if (!box) return
    box.innerHTML = list.map(function (n) {
      return '' +
        '<a class="card" href="#/news/' + n.id + '">' +
          '<div class="row-between" style="margin-bottom:8px">' +
            '<span class="news-category">' + esc(n.category) + '</span>' +
            '<span class="muted">' + esc(n.date) + '</span>' +
          '</div>' +
          '<div class="news-title">' + esc(n.title) + '</div>' +
          '<div class="muted ellipsis-2" style="margin-top:6px">' + esc(n.summary) + '</div>' +
          '<div class="row-between" style="margin-top:10px">' +
            '<span class="muted">' + esc(n.author) + '</span>' +
            '<span class="muted">' + n.views + ' 阅读</span>' +
          '</div>' +
        '</a>'
    }).join('')
  }

  /* ============ 启动 ============ */

  var topbarEl = null
  var tabbarEl = null

  function boot() {
    topbarEl = document.getElementById('topbar')
    tabbarEl = document.getElementById('tabbar')
    pageEl = document.getElementById('page')

    if (!location.hash) {
      location.hash = '#/home'
    }
    document.addEventListener('click', onClick)
    document.addEventListener('input', onInput)
    window.addEventListener('hashchange', render)
    render()
  }

  if (typeof document !== 'undefined' && typeof window !== 'undefined') {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot)
    } else {
      boot()
    }
  }

  /* 调试 / 测试钩子 */
  if (typeof globalThis !== 'undefined') {
    globalThis.__APP__ = {
      store: store,
      parseHash: parseHash,
      ui: ui,
      esc: esc,
      formatDate: formatDate,
      KEYS: KEYS,
      getJobs: getJobs,
      queryJobs: queryJobs,
      getJobById: getJobById,
      getNews: getNews,
      getNewsCategories: getNewsCategories,
      getFaqs: getFaqs
    }
  }
})()

  </script>
</body>
</html>
